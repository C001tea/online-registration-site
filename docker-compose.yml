services:
  db:
    image: postgres:15
    container_name: postgres_db
    environment:
      - POSTGRES_DB=business_db
      - POSTGRES_USER=artacsercs
      - POSTGRES_PASSWORD=${DATA_BASE_PASSWORD}
#    ports:
#      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

  web:
    build: .
    depends_on:
      - db
    container_name: django_salon_tools
    # Миграции, collectstatic и gunicorn — в docker-entrypoint.sh
    ports:
      - "80:8000"
    volumes:
      - .:/app
    environment:
      - DATABASE_URL=postgres://artacsercs:${DATA_BASE_PASSWORD}@db:5432/business_db
    restart: always

volumes:
  pg_data: