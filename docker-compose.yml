version: '3.8'

services:
  db:
    image: postgres:15
    container_name: django_postgres_db
    environment:
      - POSTGRES_DB=business_db
      - POSTGRES_USER=artacsercs
      - POSTGRES_PASSWORD=${DATA_BASE_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

volumes:
  pg_data: