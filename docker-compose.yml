services:
  db:
    image: postgres:15
    container_name: postgres_db
    environment:
      - POSTGRES_DB=business_db
      - POSTGRES_USER=artacsercs
      - POSTGRES_PASSWORD=${DATA_BASE_PASSWORD}
#    ports:
#      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

  web:
    build: .
    depends_on:
      - db
    # Без container_name: при деплое рядом со старым запускается новый
    # контейнер (deploy/deploy.sh), имя у них должно быть разным.
    # Время на завершение начатых запросов при остановке
    stop_grace_period: 30s
    # Миграции, collectstatic и gunicorn — в docker-entrypoint.sh.
    # Наружу не открыт: запросы приходят только через caddy
    expose:
      - "8000"
    volumes:
      - .:/app
    environment:
      - DATABASE_URL=postgres://artacsercs:${DATA_BASE_PASSWORD}@db:5432/business_db
      - SKIP_PREPARE=${SKIP_PREPARE:-0}
    restart: always

  caddy:
    image: caddy:2.8.4-alpine
    container_name: caddy_salon
    depends_on:
      - web
    ports:
      - "80:80"
      - "443:443"
    environment:
      - API_DOMAIN=${API_DOMAIN:-localhost}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: always

volumes:
  pg_data:
  caddy_data:
  caddy_config: