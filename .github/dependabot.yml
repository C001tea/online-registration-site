# Обновления зависимостей: раз в неделю Dependabot открывает PR. Мелкие (minor/patch) — одним PR,
# крупные (major) — отдельными, их смотрим внимательнее. Каждый PR проходит тесты (ci.yml).
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Chisinau
    open-pull-requests-limit: 5
    groups:
      python-minor:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Chisinau
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Chisinau
    # Версию Python меняем вручную вместе с CI (python-version в workflow), а не автоматически
    ignore:
      - dependency-name: python
        update-types: [version-update:semver-major, version-update:semver-minor]
