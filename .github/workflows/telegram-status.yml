# Состояние Telegram-уведомлений на сервере (без имён и телефонов):
# Actions → Telegram status → Run workflow
name: Telegram status

on:
  workflow_dispatch:

jobs:
  status:
    runs-on: ubuntu-latest
    steps:
      - name: SSH-доступ
        env:
          KEY: ${{ secrets.NEW_SERVER_SSH_KEY }}
          HOST: ${{ secrets.NEW_SERVER_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_server
          chmod 600 ~/.ssh/id_server
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Состояние
        env:
          HOST: ${{ secrets.NEW_SERVER_HOST }}
          SSH_USER: ${{ secrets.NEW_SERVER_USER || 'ubuntu' }}
        run: |
          ssh -i ~/.ssh/id_server "$SSH_USER@$HOST" "cd online-registration-site && docker compose exec -T web python manage.py telegram_status && echo && echo 'Лог процесса бота:' && docker compose logs --tail 15 telegram 2>&1 | grep -v -i -E 'chat_id|phone'"
