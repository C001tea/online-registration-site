name: Deploy Backend

on:
  push:
    branches: [ "main" ]

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd online-registration-site
            git pull origin main
            # Деплой без простоя: пока старый контейнер работает, собираем образ
            # и готовим миграции и статику; затем быстро меняем контейнер
            # (Caddy придерживает запросы, пока новый gunicorn запускается)
            docker compose build web
            docker compose run --rm --no-deps web sh -c "python manage.py migrate --noinput && python manage.py collectstatic --noinput"
            # Сначала Caddy с актуальным конфигом (Caddyfile подключён файлом,
            # изменения в нём применяет только reload) — он держит запросы,
            # пока меняется web
            docker compose up -d --no-build --no-deps caddy
            docker compose exec -T caddy caddy reload --config /etc/caddy/Caddyfile --adapter caddyfile
            SKIP_PREPARE=1 docker compose up -d --no-build web
            docker image prune -f