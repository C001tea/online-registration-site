name: Tests

# Тесты на каждый PR; деплой вызывает этот же workflow и без зелёных тестов не идёт
on:
  pull_request:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    # Та же СУБД, что на сервере: SQLite не ловит, например, ограничения SELECT ... FOR UPDATE
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SECRET_KEY: ci-secret-key-ci-secret-key-ci-secret-key-ci-secret-key-1234
      DATABASE_URL: postgres://ci:ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Django check
        run: python manage.py check
      - name: Миграции соответствуют моделям
        run: python manage.py makemigrations --check --dry-run
      - name: Тесты
        run: python manage.py test

  # Браузерные тесты сайта и панели с этим бэкендом (тесты — в репозитории фронтенда, e2e/).
  # Только на PR: деплой (workflow_call) их не ждёт, всё в main и так приходит через PR
  e2e:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    uses: NichitaOrmanji/nail-salon-frontend/.github/workflows/e2e.yml@main
    with:
      frontend_ref: main
      backend_ref: ${{ github.sha }}
